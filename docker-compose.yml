services:
  postgres:
    image: postgres:16-alpine
    container_name: payhive-postgres
    environment:
      POSTGRES_USER: payhive
      POSTGRES_PASSWORD: payhive
      POSTGRES_DB: payhive
    ports:
      - '5432:5432'
    volumes:
      - payhive-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payhive -d payhive']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payhive-pgdata:
